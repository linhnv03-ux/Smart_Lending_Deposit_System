# ===================================================================
# SLDS Banking Microservices Ecosystem - GitLab CI/CD Pipeline
# ===================================================================

stages:
  - test
  - build
  - containerize
  - deploy

variables:
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA

# Global Cache for Maven and Node.js dependencies
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository
    - node_modules/
    - .npm/

# ===================================================================
# STAGE 1: TEST & STATIC ANALYSIS
# ===================================================================

# 1.1 Backend Unit & Integration Tests across all 5 microservices
backend:test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - echo ">>> Validating Maven POM and running unit tests across all microservices..."
    - mvn $MAVEN_CLI_OPTS clean test -Dspring.profiles.active=test
  artifacts:
    when: always
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
    paths:
      - "*/target/surefire-reports/"
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web"'

# 1.2 Frontend Lint, Typecheck & Test
frontend:lint-and-test:
  stage: test
  image: node:20-alpine
  script:
    - echo ">>> Installing dependencies and running frontend linters..."
    - npm ci --cache .npm --prefer-offline || npm install
    - npm run lint --if-present
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web"'

# 1.3 Validate Docker Compose Syntax and Service Topology
docker:compose-validate:
  stage: test
  image: docker:25.0
  services:
    - docker:25.0-dind
  script:
    - echo ">>> Validating docker-compose.yml configuration..."
    - docker compose config
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web"'

# ===================================================================
# STAGE 2: COMPILE & PACKAGE ARTIFACTS
# ===================================================================

# 2.1 Package Backend Spring Boot Executable JARs
backend:package:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - echo ">>> Packaging Spring Boot Microservices into executable JARs..."
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - "*/target/*.jar"
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG'

# 2.2 Build Frontend Production Web Bundle
frontend:build:
  stage: build
  image: node:20-alpine
  script:
    - echo ">>> Building React/TypeScript frontend production bundle..."
    - npm ci --cache .npm --prefer-offline || npm install
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG'

# ===================================================================
# STAGE 3: CONTAINERIZE & PUSH TO GITLAB CONTAINER REGISTRY
# ===================================================================

.docker_build_template: &docker_build_definition
  stage: containerize
  image: docker:25.0
  services:
    - docker:25.0-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'

# 3.1 Gateway & Auth Service Container
docker:gateway-auth:
  <<: *docker_build_definition
  needs: ["backend:package"]
  script:
    - docker build -t $CI_REGISTRY_IMAGE/slds-gateway-auth-service:$IMAGE_TAG -t $CI_REGISTRY_IMAGE/slds-gateway-auth-service:latest -f ./slds-gateway-auth-service/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/slds-gateway-auth-service:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/slds-gateway-auth-service:latest

# 3.2 Loan Service Container
docker:loan-service:
  <<: *docker_build_definition
  needs: ["backend:package"]
  script:
    - docker build -t $CI_REGISTRY_IMAGE/slds-loan-service:$IMAGE_TAG -t $CI_REGISTRY_IMAGE/slds-loan-service:latest -f ./slds-loan-service/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/slds-loan-service:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/slds-loan-service:latest

# 3.3 Deposit Service Container
docker:deposit-service:
  <<: *docker_build_definition
  needs: ["backend:package"]
  script:
    - docker build -t $CI_REGISTRY_IMAGE/slds-deposit-service:$IMAGE_TAG -t $CI_REGISTRY_IMAGE/slds-deposit-service:latest -f ./slds-deposit-service/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/slds-deposit-service:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/slds-deposit-service:latest

# 3.4 Credit Assessment Service Container
docker:credit-assessment:
  <<: *docker_build_definition
  needs: ["backend:package"]
  script:
    - docker build -t $CI_REGISTRY_IMAGE/slds-credit-assessment-service:$IMAGE_TAG -t $CI_REGISTRY_IMAGE/slds-credit-assessment-service:latest -f ./slds-credit-assessment-service/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/slds-credit-assessment-service:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/slds-credit-assessment-service:latest

# 3.5 Core Banking Adapter Container
docker:core-banking-adapter:
  <<: *docker_build_definition
  needs: ["backend:package"]
  script:
    - docker build -t $CI_REGISTRY_IMAGE/slds-core-banking-adapter-service:$IMAGE_TAG -t $CI_REGISTRY_IMAGE/slds-core-banking-adapter-service:latest -f ./slds-core-banking-adapter-service/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/slds-core-banking-adapter-service:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/slds-core-banking-adapter-service:latest

# 3.6 Frontend Web Application Container
docker:web-app:
  <<: *docker_build_definition
  needs: ["frontend:build"]
  script:
    - docker build -t $CI_REGISTRY_IMAGE/slds-web-app:$IMAGE_TAG -t $CI_REGISTRY_IMAGE/slds-web-app:latest -f ./Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/slds-web-app:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/slds-web-app:latest

# ===================================================================
# STAGE 4: CONTINUOUS DEPLOYMENT (CD)
# ===================================================================

deploy:staging:
  stage: deploy
  environment:
    name: staging
    url: https://staging-slds.bank.internal
  script:
    - echo "======================================================="
    - echo "🚀 Deploying SLDS Banking Ecosystem to STAGING"
    - echo "Version Tag: $IMAGE_TAG"
    - echo "======================================================="
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:production:
  stage: deploy
  environment:
    name: production
    url: https://slds.bank.internal
  script:
    - echo "======================================================="
    - echo "🌟 Deploying SLDS Banking Ecosystem to PRODUCTION"
    - echo "Version Tag: $IMAGE_TAG"
    - echo "======================================================="
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
  when: manual
