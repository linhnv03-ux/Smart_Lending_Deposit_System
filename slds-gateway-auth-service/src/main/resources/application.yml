server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: slds-gateway-auth-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}

  cloud:
    gateway:
      routes:
        - id: loan-service
          uri: ${LOAN_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/loans/**
        - id: deposit-service
          uri: ${DEPOSIT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/deposits/**
        - id: credit-assessment-service
          uri: ${ASSESSMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/assessment/**
        - id: core-banking-adapter-service
          uri: ${CORE_BANKING_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/core-banking/**

jwt:
  secret: slds_super_secret_jwt_key_2026_bank_secure_key_123456
  expiration-ms: 86400000

logging:
  level:
    com.bank.slds: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
