server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: slds-loan-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/slds_loans
    username: ${POSTGRES_USER:slds_user}
    password: ${POSTGRES_PASSWORD:slds_secret_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}

  activemq:
    broker-url: tcp://${ACTIVEMQ_HOST:localhost}:61616
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}

  jms:
    pub-sub-domain: false
    template:
      default-destination: loan.application.queue

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 10000ms
    instances:
      coreBankingAdapter:
        base-config: default

elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  index-name: slds-audit-logs

jwt:
  secret: slds_super_secret_jwt_key_bank_grade_2026_java17_spring_boot_3
